name: Create OCI Instance

on:
  push:
    branches:
      - main
  workflow_dispatch:

  schedule:
    - cron: '*/20 * * * *'

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: create-oci-instance
  cancel-in-progress: false

jobs:
  create-instance:
    runs-on: ubuntu-latest
    name: create-instance (PHP 8.3)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Write private key to file
        env:
          KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY_CONTENT }}
        run: |
          if echo "$KEY_CONTENT" | grep -q "BEGIN"; then
            printf '%s\n' "$KEY_CONTENT" | tr -d '\r' > /tmp/oci_private_key.pem
          else
            echo "$KEY_CONTENT" | tr -d ' \r\n' | base64 -d > /tmp/oci_private_key.pem
          fi
          chmod 600 /tmp/oci_private_key.pem

      - name: Debug key file
        run: |
          echo "=== Key file info ==="
          echo "Lines: $(wc -l < /tmp/oci_private_key.pem)"
          echo "First line: $(head -1 /tmp/oci_private_key.pem)"
          echo "Last line: $(tail -1 /tmp/oci_private_key.pem)"
          echo "=== OpenSSL validation ==="
          openssl pkey -in /tmp/oci_private_key.pem -noout 2>&1 || openssl rsa -in /tmp/oci_private_key.pem -noout 2>&1 || true
          echo "=== Fingerprint from key ==="
          openssl pkey -in /tmp/oci_private_key.pem -pubout 2>/dev/null | openssl md5 -c 2>/dev/null || true

      - name: Run script
        id: launch
        run: |
          OCI_SSH_PUBLIC_KEY=$(echo "$OCI_SSH_PUBLIC_KEY" | tr -d '\r\n')
          export OCI_SSH_PUBLIC_KEY
          php index.php | tee /tmp/launch.log
          if grep -q '"lifecycleState"' /tmp/launch.log; then
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_PRIVATE_KEY_FILENAME: /tmp/oci_private_key.pem
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          # Restore the preserved OGNIO boot volume (it lives in AD-1, so the AD is fixed).
          OCI_BOOT_VOLUME_ID: ocid1.bootvolume.oc1.eu-paris-1.abrwiljre362dmqlwiaxzlj7jxegxip25oiqvjhwdrr3no4s4fjwfbi3ugya
          OCI_AVAILABILITY_DOMAIN: 'Nnnc:EU-PARIS-1-AD-1'
          OCI_OCPUS: 2
          OCI_MEMORY_IN_GBS: 12
          OCI_SHAPE: VM.Standard.A1.Flex
          OCI_MAX_INSTANCES: 1
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}

      # GitHub e-mails the repo owner about the new issue; the schedule then stops.
      - name: Notify by issue and stop the schedule
        if: steps.launch.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The OCI instance was created by run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
            echo
            echo "Next: attach the reserved IP 158.178.210.71 to its VNIC."
            echo
            echo '```json'
            cat /tmp/launch.log
            echo '```'
          } > /tmp/issue.md
          gh issue create -R "${{ github.repository }}" \
            --title "OCI instance created $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --body-file /tmp/issue.md \
            --assignee "${{ github.repository_owner }}"
          gh workflow disable "Create OCI Instance" -R "${{ github.repository }}"
